name: ci

# Every push/PR must pass: formatting, clippy and the Python suite — on both
# supported backends. The README's "run `cargo fmt` before every commit"
# rule is enforced here instead of by hand.
on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Windows backend: AppContainer + Job Object.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        # Warnings are errors: the `never_loop` finding used to make this
        # step fail outright, which is exactly what we want to keep.
        run: cargo clippy --all-targets -- -D warnings
      - name: Set up environment
        run: uv sync --extra test
      - name: Build extension
        run: uv run --no-project maturin develop --release
      - name: Python suite
        run: uv run --no-project python -m pytest -q

  # Linux backend: namespaces + cgroups v2. The suite needs root
  # (CAP_SYS_ADMIN for mount/namespace/cgroup writes), so the interpreter
  # of the project environment is run under sudo.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Set up environment
        run: uv sync --extra test
      - name: Build extension
        run: uv run --no-project maturin develop --release
      - name: "Python suite (root: namespaces + cgroups v2)"
        run: sudo -E "$PWD/.venv/bin/python" -m pytest -q
