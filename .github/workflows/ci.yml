name: ci

# Every push/PR must pass: formatting and clippy — on both supported
# backends. The README's "run `cargo fmt` before every commit" rule is
# enforced here instead of by hand.
on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Windows backend: AppContainer + Job Object.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        # Warnings are errors: the `never_loop` finding used to make this
        # step fail outright, which is exactly what we want to keep.
        run: cargo clippy --all-targets -- -D warnings
      - name: Build extension
        run: uv run --no-project maturin develop --release
        env:
          # maturin needs the venv concept; use the system interpreter.
          VIRTUAL_ENV: ${{ env.pythonLocation }}

  # Linux backend: namespaces + cgroups v2.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build extension
        run: uv run --no-project maturin develop --release
        env:
          VIRTUAL_ENV: ${{ env.pythonLocation }}
