[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "river"
description = "Sandbox for running untrusted executables with resource limits (Rust extension, Windows and Linux backends)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["sandbox", "judge", "untrusted", "appcontainer", "seccomp", "cgroups"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/algoux/river"

[project.optional-dependencies]
# S13 test suite (pytest three-pack: functional / attack / limits).
test = ["pytest>=7.0"]

[tool.maturin]
features = ["pyo3/extension-module"]

[tool.uv]
# The extension is built and installed by `maturin develop`; uv should only
# manage the environment's dependencies.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The sandbox tests spawn real processes; they must not run in parallel
# with each other on purpose (they are independent, but each run costs
# ~100ms of process creation).
addopts = "-ra"
markers = [
    "attack: attack-surface tests (must be denied inside the sandbox)",
    "slow: takes more than a second",
]
