[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "river"
description = "Rootless Linux sandbox for untrusted programs, with judge-grade resource limits and accounting"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "sandbox",
    "judge",
    "untrusted",
    "rootless",
    "namespaces",
    "seccomp",
    "landlock",
    "cgroups",
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/algoux/river"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
module-name = "river._river"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.uv]
# The extension module is built and installed by `maturin develop`; uv only
# manages the environment's dependencies.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "functional: end-to-end sandbox behaviour (hello world, stdio, cwd, envs)",
    "limits: resource limits and verdicts (TLE / MLE / OLE, proc_limit, rlimits)",
    "attack: attack-surface tests that must be denied inside the sandbox",
    "concurrency: concurrent exec from multiple threads",
    "doctor: river.doctor() and the preflight checks",
]
