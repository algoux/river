[package]
name = "river"
version = "0.0.1"
edition = "2024"

[lib]
name = "river"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.30.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
