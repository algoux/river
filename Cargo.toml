[package]
name = "river"
version = "0.1.2"
edition = "2024"
description = "Rootless Linux sandbox for untrusted programs, with judge-grade resource limits and accounting"
license = "Apache-2.0"
repository = "https://github.com/algoux/river"

[lib]
name = "river"
crate-type = ["cdylib", "rlib"]

# Linux only: no cfg(target_os) branches by design. `pyo3/extension-module` is
# passed in by maturin (see [tool.maturin] in pyproject.toml).
[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py312"] }
libc = "0.2"
rustix = { version = "0.38", features = [
    "mount",
    "thread",
    "process",
    "fs",
    "event",
    "system",
    "time",
] }
seccompiler = "0.5"
landlock = "0.4"
caps = "0.5"
